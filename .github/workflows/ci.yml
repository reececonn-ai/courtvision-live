name: CourtVision CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/shared.js
          node --check public/stage.js
          node --check public/app.js
          node --check public/control.js
          node --check public/watch.js

      - name: Check restored inline CourtVision script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [];
          let pos = 0;
          while (true) {
            const start = html.indexOf('<script', pos);
            if (start < 0) break;
            const tagEnd = html.indexOf('>', start);
            if (tagEnd < 0) break;
            const tag = html.slice(start, tagEnd + 1);
            const end = html.indexOf('</script>', tagEnd + 1);
            if (end < 0) throw new Error('Unclosed script tag');
            if (!/\\bsrc\\s*=/.test(tag)) scripts.push(html.slice(tagEnd + 1, end));
            pos = end + 9;
          }
          if (!scripts.length) throw new Error('No inline script found');
          scripts.forEach((code, i) => new vm.Script(code, { filename: 'index-inline-' + i + '.js' }));
          console.log('Inline CourtVision JavaScript syntax OK');
          NODE

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
