name: CourtVision CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/shared.js
          node --check public/stage.js
          node --check public/app.js
          node --check public/control.js
          node --check public/watch.js

      - name: Check restored inline CourtVision script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline script found');
          scripts.forEach((m, i) => new vm.Script(m[1], { filename: 'index-inline-' + i + '.js' }));
          console.log('Inline CourtVision JavaScript syntax OK');
          NODE

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
