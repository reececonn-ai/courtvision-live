name: Create CourtVision TinyURL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-tinyurl.yml"
  workflow_dispatch:

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create TinyURL
        run: |
          SHORT=$(curl -fsSLG "https://tinyurl.com/api-create.php" \
            --data-urlencode "url=https://courtvision-live.stremio-organiser.workers.dev/")
          echo "COURTVISION_TINYURL=$SHORT"
