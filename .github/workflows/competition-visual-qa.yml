name: Competition + Nerd Stats Visual QA

on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/competition.js"
      - "public/competition.css"
      - ".github/workflows/competition-visual-qa.yml"
  workflow_dispatch:

jobs:
  competition-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium
      - run: |
          python -m http.server 8000 --directory public >/tmp/cv-http.log 2>&1 &
          sleep 2

      - name: Check Competition and Stats for Nerds
        run: |
          cat >/tmp/competition_desktop.py <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          d=webdriver.Chrome(options=o)

          def rect(sel):
              return d.execute_script("""
                const e=document.querySelector(arguments[0]); if(!e)return null;
                const r=e.getBoundingClientRect();
                return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};
              """,sel)

          def audit(width,height,label):
              d.set_window_size(width,height)
              d.get("http://127.0.0.1:8000/?room=competitionqa")
              time.sleep(1.2)
              d.execute_script("loadTestDraft(true)")
              time.sleep(.8)

              comp=d.execute_script("""
                const q=s=>document.querySelector(s), r=e=>{const x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,width:x.width,height:x.height,right:x.right,bottom:x.bottom}:null};
                const t=q('#broadcastTicker'),tr=t?.getBoundingClientRect(),ts=t?getComputedStyle(t):null;
                return {
                  active:q('.screen.active')?.id,
                  bodyScreen:document.body.dataset.screen,
                  sidebar:getComputedStyle(q('.sidebar')).display,
                  viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth},
                  screen:r(q('#competitionScreen')),
                  shell:r(q('#competitionScreen .competition-shell')),
                  ticker:r(t),
                  tickerPosition:ts?.position,
                  games:document.querySelectorAll('#competitionGames .comp-game').length,
                  stories:document.querySelectorAll('#competitionTidbits .comp-tidbit').length,
                  cards:document.querySelectorAll('#competitionLeaderboard .comp-player-card').length,
                  chips:document.querySelectorAll('#competitionLeaderboard .comp-team-chip').length,
                  mode:q('#competitionModeBadge')?.textContent?.trim()
                };
              """)
              print("COMP_"+label+"="+json.dumps(comp,sort_keys=True))
              d.save_screenshot("/tmp/competition-"+label+".png")

              if comp["active"]!="competitionScreen" or comp["bodyScreen"]!="competitionScreen":
                  raise SystemExit("Competition not active")
              if comp["sidebar"]!="none":
                  raise SystemExit("Competition sidebar visible")
              if comp["viewport"]["scrollWidth"] > comp["viewport"]["w"]+2:
                  raise SystemExit("Competition horizontal overflow")
              if not comp["screen"] or comp["screen"]["width"] < comp["viewport"]["w"]-2:
                  raise SystemExit("Competition not full width")
              if not comp["shell"] or comp["shell"]["width"] < comp["viewport"]["w"]-34:
                  raise SystemExit("Competition shell wastes too much horizontal space")
              if comp["tickerPosition"]!="fixed" or not comp["ticker"]:
                  raise SystemExit("Competition ticker is not fixed")
              if comp["ticker"]["x"] > 2 or comp["ticker"]["width"] < comp["viewport"]["w"]-4:
                  raise SystemExit("Competition ticker is not edge-to-edge")
              if comp["games"]<1 or comp["stories"]<1 or comp["cards"]!=6 or comp["chips"]!=30:
                  raise SystemExit("Competition content incomplete")
              if comp["mode"]!="DEMO DATA":
                  raise SystemExit("Competition demo badge missing")

              d.execute_script("openStatsForNerds()")
              time.sleep(.6)
              nerd=d.execute_script("""
                const q=s=>document.querySelector(s), rr=s=>{const e=q(s),x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,width:x.width,height:x.height,right:x.right,bottom:x.bottom}:null};
                const t=q('#broadcastTicker'),ts=t?getComputedStyle(t):null;
                return {
                  active:q('.screen.active')?.id,
                  bodyScreen:document.body.dataset.screen,
                  sidebar:getComputedStyle(q('.sidebar')).display,
                  viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth},
                  screen:rr('#statsForNerdsScreen'),
                  shell:rr('#statsForNerdsScreen .nerd-shell'),
                  ticker:rr('#broadcastTicker'),
                  tickerPosition:ts?.position,
                  owners:document.querySelectorAll('#nerdOwners .nerd-owner-card').length,
                  expectationRows:document.querySelectorAll('#nerdExpectation .nerd-list-row').length,
                  matrixRows:document.querySelectorAll('#nerdRivalryMatrix tbody tr').length,
                  ownerY:rr('#nerdOwners')?.y,
                  matrixY:rr('#nerdRivalryMatrix')?.y,
                  expectationY:rr('#nerdExpectation')?.y
                };
              """)
              print("NERD_"+label+"="+json.dumps(nerd,sort_keys=True))
              d.save_screenshot("/tmp/nerds-"+label+".png")

              if nerd["active"]!="statsForNerdsScreen" or nerd["bodyScreen"]!="statsForNerdsScreen":
                  raise SystemExit("Stats for Nerds not active")
              if nerd["sidebar"]!="none":
                  raise SystemExit("Stats sidebar visible")
              if nerd["viewport"]["scrollWidth"] > nerd["viewport"]["w"]+2:
                  raise SystemExit("Stats horizontal overflow")
              if not nerd["screen"] or nerd["screen"]["width"] < nerd["viewport"]["w"]-2:
                  raise SystemExit("Stats not full width")
              if nerd["tickerPosition"]!="fixed" or nerd["ticker"]["x"]>2 or nerd["ticker"]["width"]<nerd["viewport"]["w"]-4:
                  raise SystemExit("Stats ticker is not fixed edge-to-edge")
              if nerd["owners"]!=6:
                  raise SystemExit("Owner deep dives missing")
              if nerd["expectationRows"]>6:
                  raise SystemExit("Over/Under expectation is no longer condensed")
              if nerd["matrixRows"]!=6:
                  raise SystemExit("Rivalry matrix incomplete")
              if not (nerd["ownerY"] < nerd["matrixY"] < nerd["expectationY"]):
                  raise SystemExit("Rivalry content is not prioritized after Owner Deep Dives")

              # Remote ordinary data updates must not move this browser off Stats for Nerds.
              isolated=d.execute_script("""
                const snap=cvSharedSnapshot();
                snap.origin='qa-other-viewer';
                snap.rev=Date.now()+500000;
                snap.draft.lastAction='Remote data update';
                snap.draft.liveSpin=null;
                snap.draft.onTheBoard=null;
                cvApplySnapshot(snap);
                return document.querySelector('.screen.active')?.id;
              """)
              if isolated!="statsForNerdsScreen":
                  raise SystemExit("Remote data update changed local page navigation")

          try:
              audit(1366,768,"1366x768")
              audit(1600,1000,"1600x1000")
          finally:
              d.quit()
          PY
          python /tmp/competition_desktop.py

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-nerd-desktop-qa
          path: |
            /tmp/competition-1366x768.png
            /tmp/competition-1600x1000.png
            /tmp/nerds-1366x768.png
            /tmp/nerds-1600x1000.png
          if-no-files-found: warn
