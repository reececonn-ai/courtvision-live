name: CourtVision Mobile Visual QA

on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/competition.js"
      - "public/competition.css"
      - ".github/workflows/mobile-visual-qa.yml"
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install selenium

      - name: Start local server
        run: |
          python -m http.server 8000 --directory public > /tmp/cv-http.log 2>&1 &
          sleep 2

      - name: Run iPhone viewport checks
        run: |
          cat > /tmp/mobile_qa.py <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--hide-scrollbars")
          opts.add_experimental_option("mobileEmulation", {
              "deviceMetrics": {"width": 390, "height": 844, "pixelRatio": 3},
              "userAgent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          })

          driver = webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(30)

          def rect(selector):
              return driver.execute_script("""
                const e=document.querySelector(arguments[0]);
                if(!e)return null;
                const r=e.getBoundingClientRect();
                return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom,
                        scrollWidth:e.scrollWidth,clientWidth:e.clientWidth};
              """, selector)

          try:
              driver.get("http://127.0.0.1:8000/?room=mobileqa")
              time.sleep(2)

              driver.execute_script("showReveal('New Orleans Pelicans')")
              time.sleep(1)
              reveal = {
                  "viewport": driver.execute_script("return {w:innerWidth,h:innerHeight,dpr:devicePixelRatio,scrollWidth:document.documentElement.scrollWidth};"),
                  "shell": rect(".shell"),
                  "sidebar": rect(".sidebar"),
                  "stage": rect(".stage"),
                  "screen": rect("#revealScreen"),
                  "grid": rect("#revealScreen .reveal-grid"),
                  "teamMain": rect("#revealScreen .team-main"),
                  "masthead": rect("#revealScreen .team-masthead"),
                  "metrics": rect("#revealScreen .masthead-metrics"),
                  "startingFive": rect("#revealScreen .starting-five-panel"),
                  "rightRail": rect("#revealScreen .right-rail"),
              }
              styles = driver.execute_script("""
                const sels=['body','.shell','.stage','#revealScreen','#revealScreen .reveal-grid','#revealScreen .team-main','#revealScreen .right-rail'];
                const out={bodyClass:document.body.className};
                for(const s of sels){
                  const e=document.querySelector(s); if(!e){out[s]=null;continue}
                  const cs=getComputedStyle(e), r=e.getBoundingClientRect();
                  out[s]={display:cs.display,width:cs.width,minWidth:cs.minWidth,maxWidth:cs.maxWidth,
                    height:cs.height,position:cs.position,transform:cs.transform,zoom:cs.zoom,
                    flex:cs.flex,flexBasis:cs.flexBasis,alignSelf:cs.alignSelf,
                    marginLeft:cs.marginLeft,marginRight:cs.marginRight,
                    paddingLeft:cs.paddingLeft,paddingRight:cs.paddingRight,
                    rect:{x:r.x,width:r.width,right:r.right}};
                }
                return out;
              """)
              print("REVEAL_STYLES="+json.dumps(styles, sort_keys=True))
              print("REVEAL_METRICS="+json.dumps(reveal, sort_keys=True))
              driver.save_screenshot("/tmp/reveal-390x844.png")

              driver.execute_script("showScreen('wheelScreen')")
              time.sleep(1)
              wheel = {
                  "viewport": driver.execute_script("return {w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth};"),
                  "screen": rect("#wheelScreen"),
                  "teamBoard": rect("#wheelTeamBoardWrap"),
                  "teamGrid": rect("#wheelTeamGrid"),
                  "teamTile": rect("#wheelTeamGrid .wheel-team-tile"),
                  "teamCount": driver.execute_script("return document.querySelectorAll('#wheelTeamGrid .wheel-team-tile').length"),
                  "wheelWrap": rect("#wheelScreen .wheel-wrap"),
                  "canvas": rect("#wheel"),
                  "spin": rect("#spinBtn"),
              }
              ticker = driver.execute_script("""
                const t=document.querySelector('#broadcastTicker'), n=document.querySelector('.mobile-nav');
                const tr=t.getBoundingClientRect(), nr=n.getBoundingClientRect(), cs=getComputedStyle(t);
                return {display:cs.display, position:cs.position, top:tr.top, bottom:tr.bottom, height:tr.height,
                        navTop:nr.top, navHeight:nr.height, title:document.querySelector('.brand h1')?.textContent?.trim(),
                        documentTitle:document.title};
              """)
              print("PHONE_TICKER="+json.dumps(ticker, sort_keys=True))

              spin_result = driver.execute_script("""
                const before=wheelRotation;
                const snap=cvSharedSnapshot();
                snap.origin='remote-mobile-qa';
                snap.rev=Date.now()+100000;
                snap.draft.onTheBoard=null;
                snap.draft.lastScreen='wheelScreen';
                snap.draft.liveSpin={
                  id:'qa-remote-spin-'+Date.now(),
                  targetName:state.available[0],
                  startRotation:before,
                  spins:8,
                  duration:1400,
                  startedAt:Date.now()
                };
                cvApplySnapshot(snap);
                return {before, target:snap.draft.liveSpin.targetName};
              """)
              time.sleep(0.45)
              spin_after = driver.execute_script("""
                return {rotation:wheelRotation, spinning, active:document.querySelector('.screen.active')?.id,
                        spinText:document.querySelector('#spinBtn')?.textContent};
              """)
              print("REMOTE_SPIN="+json.dumps({"start":spin_result,"after":spin_after}, sort_keys=True))

              print("WHEEL_METRICS="+json.dumps(wheel, sort_keys=True))
              driver.save_screenshot("/tmp/wheel-390x844.png")

              if ticker["documentTitle"] != "NBA TEAM DRAFT DAY":
                  raise SystemExit("Document title is not NBA TEAM DRAFT DAY")
              if ticker["display"] == "none" or ticker["height"] < 28:
                  raise SystemExit("Phone ticker is not visible")
              if ticker["bottom"] > ticker["navTop"] + 2:
                  raise SystemExit("Phone ticker overlaps the mobile navigation")
              if spin_after["active"] != "wheelScreen":
                  raise SystemExit("Remote spin did not force the wheel screen")
              if abs(spin_after["rotation"] - spin_result["before"]) < 0.05:
                  raise SystemExit("Remote spin did not animate the wheel")

              follow = driver.execute_script("""
                const snap=cvSharedSnapshot();
                snap.origin='remote-mobile-qa-follow';
                snap.rev=Date.now()+200000;
                snap.draft.liveSpin=null;
                snap.draft.onTheBoard=null;
                snap.draft.lastScreen='wheelScreen';
                cvApplySnapshot(snap);
                return {active:document.querySelector('.screen.active')?.id, spinning};
              """)
              print("FOLLOW_TO_WHEEL="+json.dumps(follow, sort_keys=True))
              if follow["active"] != "wheelScreen" or follow["spinning"]:
                  raise SystemExit("Remote assignment/pass state did not settle on wheel")

              if wheel["teamCount"] != 30:
                  raise SystemExit("Above-wheel Draft Board does not show all 30 teams")
              if not wheel["teamBoard"] or wheel["teamBoard"]["width"] > wheel["viewport"]["w"] + 2:
                  raise SystemExit("Above-wheel Draft Board does not fit the phone")
              wheel_preview_before = driver.execute_script("return {onTheBoard:state.onTheBoard,lastScreen:state.lastScreen,currentTeam};")
              driver.execute_script("previewTeamFromWheel('Boston Celtics')")
              time.sleep(0.25)
              wheel_preview = driver.execute_script("""
                return {active:document.querySelector('.screen.active')?.id,
                        previewMode:document.querySelector('#revealScreen')?.classList.contains('team-preview-mode'),
                        onTheBoard:state.onTheBoard,lastScreen:state.lastScreen,currentTeam,
                        broadcast:document.querySelector('#broadcastTeam')?.textContent};
              """)
              print("WHEEL_TEAM_PREVIEW="+json.dumps({"before":wheel_preview_before,"preview":wheel_preview}, sort_keys=True))
              if wheel_preview["active"] != "revealScreen" or not wheel_preview["previewMode"]:
                  raise SystemExit("Above-wheel team tile did not open preview")
              if wheel_preview["onTheBoard"] is not None or wheel_preview["lastScreen"] != wheel_preview_before["lastScreen"]:
                  raise SystemExit("Above-wheel team preview changed shared draft state")
              driver.execute_script("closeTeamPreview()")
              time.sleep(0.2)
              wheel_preview_close = driver.execute_script("return {active:document.querySelector('.screen.active')?.id,onTheBoard:state.onTheBoard,lastScreen:state.lastScreen};")
              print("WHEEL_TEAM_PREVIEW_CLOSE="+json.dumps(wheel_preview_close, sort_keys=True))
              if wheel_preview_close["active"] != "wheelScreen" or wheel_preview_close["onTheBoard"] is not None:
                  raise SystemExit("Above-wheel team preview did not return to wheel")

              driver.execute_script("openDraftBoard()")
              time.sleep(0.5)
              board = {
                  "viewport": driver.execute_script("return {w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth};"),
                  "screen": rect("#draftBoardScreen"),
                  "shell": rect("#draftBoardScreen .board-shell"),
                  "head": rect("#draftBoardScreen .board-head"),
                  "players": rect("#boardPlayerSummary"),
                  "pulse": rect("#draftPulse"),
                  "grid": rect("#draftBoardGrid"),
                  "team0": rect("#draftBoardGrid .board-team"),
              }
              print("BOARD_METRICS="+json.dumps(board, sort_keys=True))
              driver.save_screenshot("/tmp/board-390x844.png")

              preview_before = driver.execute_script("""
                return {onTheBoard:state.onTheBoard, lastScreen:state.lastScreen, currentTeam};
              """)
              driver.execute_script("previewTeamFromBoard(state.available[0])")
              time.sleep(0.5)
              preview = driver.execute_script("""
                const exit=document.querySelector('#teamPreviewExit');
                const assign=document.querySelector('#revealScreen .bid-actions');
                return {
                  active:document.querySelector('.screen.active')?.id,
                  previewMode:document.querySelector('#revealScreen')?.classList.contains('team-preview-mode'),
                  onTheBoard:state.onTheBoard,
                  lastScreen:state.lastScreen,
                  currentTeam,
                  exitDisplay:exit?getComputedStyle(exit).display:null,
                  assignDisplay:assign?getComputedStyle(assign).display:null,
                  broadcast:document.querySelector('#broadcastTeam')?.textContent
                };
              """)
              print("TEAM_PREVIEW="+json.dumps({"before":preview_before,"preview":preview}, sort_keys=True))
              driver.save_screenshot("/tmp/team-preview-390x844.png")

              if preview["active"] != "teamsHubScreen":
                  raise SystemExit("Draft Board team did not open Team Stats")
              if preview["onTheBoard"] is not None:
                  raise SystemExit("Team preview changed onTheBoard")
              if preview["lastScreen"] != preview_before["lastScreen"]:
                  raise SystemExit("Team preview changed shared lastScreen")

              driver.execute_script("openDraftBoard()")
              time.sleep(0.25)
              preview_close = driver.execute_script("""
                return {active:document.querySelector('.screen.active')?.id,onTheBoard:state.onTheBoard,lastScreen:state.lastScreen,currentTeam};
              """)
              print("TEAM_PREVIEW_CLOSE="+json.dumps(preview_close, sort_keys=True))
              if preview_close["active"] != "draftBoardScreen" or preview_close["onTheBoard"] is not None:
                  raise SystemExit("Team preview did not return safely to Draft Board")

              # Full post-draft Competition Board in deterministic demo mode.
              driver.execute_script("loadTestDraft(true)")
              time.sleep(0.8)
              comp = {
                  "viewport": driver.execute_script("return {w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth};"),
                  "screen": rect("#competitionScreen"),
                  "shell": rect("#competitionScreen .competition-shell"),
                  "players": driver.execute_script("return document.querySelectorAll('#competitionLeaderboard .comp-player-card').length"),
                  "teamChips": driver.execute_script("return document.querySelectorAll('#competitionLeaderboard .comp-team-chip').length"),
                  "games": driver.execute_script("return document.querySelectorAll('#competitionGames .comp-game').length"),
                  "tidbits": driver.execute_script("return document.querySelectorAll('#competitionTidbits .comp-tidbit').length"),
                  "assigned": driver.execute_script("return Object.keys(state.assignments||{}).length"),
                  "mode": driver.execute_script("return document.querySelector('#competitionModeBadge')?.textContent?.trim()"),
                  "probText": driver.execute_script("return document.querySelector('#competitionLeaderboard')?.textContent||''"),
                  "tickerDuration": driver.execute_script("return getComputedStyle(document.querySelector('#tickerTrack')).animationDuration"),
              }
              print("COMPETITION_METRICS="+json.dumps(comp, sort_keys=True))
              driver.save_screenshot("/tmp/competition-390x844.png")
              if comp["assigned"] != 30 or comp["teamChips"] != 30:
                  raise SystemExit("Test draft did not populate all 30 owned teams")
              if comp["players"] != 6:
                  raise SystemExit("Competition Board did not render six player entries")
              if comp["games"] < 1:
                  raise SystemExit("Competition demo did not populate games")
              if comp["mode"] != "DEMO DATA":
                  raise SystemExit("Test Competition Board is not clearly labelled DEMO DATA")
              if "NaN" in comp["probText"]:
                  raise SystemExit("Competition probabilities contain NaN")
              if comp["viewport"]["scrollWidth"] > comp["viewport"]["w"] + 2:
                  raise SystemExit("Competition Board horizontally overflows the phone")
              if not comp["screen"] or comp["screen"]["width"] > comp["viewport"]["w"] + 2:
                  raise SystemExit("Competition Board screen is wider than the phone")
              if comp["screen"]["y"] > 180:
                  raise SystemExit("Competition Board is pushed below inactive mobile screens")
              if comp["tickerDuration"] in ("34s","42s"):
                  raise SystemExit("Ticker speed regression: old fast duration still active")

              if reveal["viewport"]["scrollWidth"] > reveal["viewport"]["w"] + 2:
                  raise SystemExit("Horizontal overflow remains on reveal")
              if reveal["grid"] and reveal["grid"]["width"] > reveal["viewport"]["w"] + 2:
                  raise SystemExit("Reveal grid wider than viewport")
              if reveal["teamMain"] and reveal["teamMain"]["width"] > reveal["viewport"]["w"] + 2:
                  raise SystemExit("Team main wider than viewport")
              if wheel["viewport"]["scrollWidth"] > wheel["viewport"]["w"] + 2:
                  raise SystemExit("Horizontal overflow remains on wheel")
              if wheel["wheelWrap"] and wheel["wheelWrap"]["width"] > wheel["viewport"]["w"]:
                  raise SystemExit("Wheel wider than viewport")
          finally:
              driver.quit()
          PY
          python /tmp/mobile_qa.py

      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtvision-mobile-qa
          path: |
            /tmp/reveal-390x844.png
            /tmp/wheel-390x844.png
            /tmp/board-390x844.png
            /tmp/team-preview-390x844.png
            /tmp/competition-390x844.png
          if-no-files-found: warn
